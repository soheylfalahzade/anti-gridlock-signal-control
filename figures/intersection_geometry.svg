<svg width="700" height="700" viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Intersection geometry schematic</title>
  <desc>Symmetric four-approach intersection C with, on each approach, a 250 m two-lane upstream storage segment and a return path split into a 50 m one-lane metered bottleneck near the junction and a 200 m one-lane exit segment further out.</desc>

  <rect x="0" y="0" width="700" height="700" fill="#ffffff"/>

  <text x="350" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280">schematic, not to scale &#8226; symmetric on all four approaches</text>

  <!-- NORTH arm -->
  <rect x="328" y="140" width="16" height="175" rx="3" fill="#2a9d8f"/>
  <rect x="356" y="140" width="16" height="135" rx="3" fill="#8e9aaf"/>
  <rect x="356" y="275" width="16" height="40" rx="3" fill="#e63946"/>
  <circle cx="364" cy="275" r="5" fill="#264653"/>
  <text x="350" y="115" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#264653">O_N</text>

  <!-- SOUTH arm -->
  <rect x="328" y="385" width="16" height="175" rx="3" fill="#2a9d8f"/>
  <rect x="356" y="425" width="16" height="135" rx="3" fill="#8e9aaf"/>
  <rect x="356" y="385" width="16" height="40" rx="3" fill="#e63946"/>
  <circle cx="364" cy="425" r="5" fill="#264653"/>
  <text x="350" y="585" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#264653">O_S</text>

  <!-- EAST arm -->
  <rect x="385" y="328" width="175" height="16" rx="3" fill="#2a9d8f"/>
  <rect x="425" y="356" width="135" height="16" rx="3" fill="#8e9aaf"/>
  <rect x="385" y="356" width="40" height="16" rx="3" fill="#e63946"/>
  <circle cx="425" cy="364" r="5" fill="#264653"/>
  <text x="580" y="368" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#264653">O_E</text>

  <!-- WEST arm -->
  <rect x="140" y="328" width="175" height="16" rx="3" fill="#2a9d8f"/>
  <rect x="140" y="356" width="135" height="16" rx="3" fill="#8e9aaf"/>
  <rect x="275" y="356" width="40" height="16" rx="3" fill="#e63946"/>
  <circle cx="275" cy="364" r="5" fill="#264653"/>
  <text x="120" y="368" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#264653">O_W</text>

  <!-- Central junction C -->
  <rect x="315" y="315" width="70" height="70" rx="6" fill="#264653"/>
  <text x="350" y="345" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">C</text>
  <text x="350" y="363" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#d9e4e6">signalized junction</text>

  <!-- Legend -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#264653">
    <rect x="80" y="615" width="20" height="14" rx="2" fill="#2a9d8f"/>
    <text x="108" y="626">upstream approach &#8212; 250 m, 2 lanes</text>

    <rect x="80" y="642" width="20" height="14" rx="2" fill="#e63946"/>
    <text x="108" y="653">metered bottleneck egress &#8212; 50 m, 1 lane</text>

    <rect x="380" y="615" width="20" height="14" rx="2" fill="#8e9aaf"/>
    <text x="408" y="626">exit segment &#8212; 200 m, 1 lane</text>

    <circle cx="390" cy="649" r="5" fill="#264653"/>
    <text x="408" y="653">metering signal M</text>
  </g>
</svg>
