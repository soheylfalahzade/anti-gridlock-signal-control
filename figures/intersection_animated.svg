<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Animated schematic: single intersection with engineered exit bottleneck</title>
<desc>Schematic loop: signal phases alternate NS/EW while a downstream-occupancy gauge triggers the anti-spillback override. Not simulation output.</desc>
<rect width="1100" height="640" fill="#0f172a"/>
<text x="20" y="30" fill="#f8fafc" font-size="20" font-weight="bold">Anti-Gridlock Signal Control: animated schematic</text>
<g transform="translate(0,40)">
<rect x="0" y="0" width="800" height="600" fill="#111c33"/>
<!-- roads -->
<rect x="0" y="260" width="800" height="80" fill="#334155"/>
<rect x="360" y="300" width="80" height="300" fill="#334155"/>
<rect x="400" y="0" width="20" height="300" fill="#475569"/>
<rect x="360" y="260" width="80" height="80" fill="#3b4a63"/>
<line x1="0" y1="300" x2="360" y2="300" stroke="#94a3b8" stroke-dasharray="10 10"/>
<line x1="440" y1="300" x2="800" y2="300" stroke="#94a3b8" stroke-dasharray="10 10"/>
<line x1="420" y1="345" x2="420" y2="600" stroke="#94a3b8" stroke-dasharray="10 10"/>
<line x1="360" y1="340" x2="440" y2="340" stroke="#e2e8f0" stroke-width="3" opacity="0.0"/>
<!-- stop lines -->
<line x1="400" y1="350" x2="440" y2="350" stroke="#e2e8f0" stroke-width="3"/>
<line x1="352" y1="300" x2="352" y2="340" stroke="#e2e8f0" stroke-width="3"/>
<line x1="448" y1="260" x2="448" y2="300" stroke="#e2e8f0" stroke-width="3"/>
<!-- labels -->
<text x="470" y="500" fill="#cbd5e1" font-size="14">Upstream storage: 2 lanes, 250 m</text>
<text x="430" y="150" fill="#fca5a5" font-size="14">Bottleneck exit: 1 lane, 50 m</text>
<text x="20" y="250" fill="#94a3b8" font-size="13">EW approach</text>
<text x="640" y="250" fill="#94a3b8" font-size="13">EW approach</text>
<!-- signal heads -->
<rect x="468" y="366" width="24" height="68" rx="6" fill="#020617" stroke="#475569"/><circle cx="480" cy="380" r="7" fill="#ef4444" opacity="0.15"><animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" begin="0s" values="0.15;1" keyTimes="0.0000;0.5000"/></circle><circle cx="480" cy="400" r="7" fill="#facc15" opacity="0.15"><animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" begin="0s" values="0.15;1;0.15;0.15" keyTimes="0.0000;0.4167;0.5000;1.0000"/></circle><circle cx="480" cy="420" r="7" fill="#22c55e" opacity="0.15"><animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" begin="0s" values="1;0.15;0.15" keyTimes="0.0000;0.4167;1.0000"/></circle>
<rect x="288" y="196" width="24" height="68" rx="6" fill="#020617" stroke="#475569"/><circle cx="300" cy="210" r="7" fill="#ef4444" opacity="0.15"><animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" begin="-6s" values="0.15;1" keyTimes="0.0000;0.5000"/></circle><circle cx="300" cy="230" r="7" fill="#facc15" opacity="0.15"><animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" begin="-6s" values="0.15;1;0.15;0.15" keyTimes="0.0000;0.4167;0.5000;1.0000"/></circle><circle cx="300" cy="250" r="7" fill="#22c55e" opacity="0.15"><animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" begin="-6s" values="1;0.15;0.15" keyTimes="0.0000;0.4167;1.0000"/></circle>
<text x="500" y="404" fill="#94a3b8" font-size="12">NS head</text>
<text x="170" y="234" fill="#94a3b8" font-size="12">EW head</text>
<g><rect x="-12" y="-6" width="24" height="12" rx="3" fill="#38bdf8"/><rect x="3" y="-4.5" width="6" height="9" rx="1.5" fill="#e2e8f0" opacity="0.85"/>
<animateMotion dur="12.0s" repeatCount="indefinite" begin="0s" rotate="auto" calcMode="linear" keyPoints="0.3967;0.3967;1.0000;0.0000;0.3967;0.3967" keyTimes="0.0000;0.0333;0.3333;0.3350;0.7500;1.0000" path="M410,600 L410,0"/></g><g><rect x="-12" y="-6" width="24" height="12" rx="3" fill="#38bdf8"/><rect x="3" y="-4.5" width="6" height="9" rx="1.5" fill="#e2e8f0" opacity="0.85"/>
<animateMotion dur="12.0s" repeatCount="indefinite" begin="0s" rotate="auto" calcMode="linear" keyPoints="0.3467;0.3467;1.0000;0.0000;0.3467;0.3467" keyTimes="0.0000;0.1083;0.4083;0.4100;0.8667;1.0000" path="M410,600 L410,0"/></g><g><rect x="-12" y="-6" width="24" height="12" rx="3" fill="#818cf8"/><rect x="3" y="-4.5" width="6" height="9" rx="1.5" fill="#e2e8f0" opacity="0.85"/>
<animateMotion dur="12.0s" repeatCount="indefinite" begin="0s" rotate="auto" calcMode="linear" keyPoints="0.3941;0.3941;1.0000;0.0000;0.3941;0.3941" keyTimes="0.0000;0.0583;0.3583;0.3600;0.7500;1.0000" path="M430,600 L430,345 L410,295 L410,0"/></g><g><rect x="-12" y="-6" width="24" height="12" rx="3" fill="#818cf8"/><rect x="3" y="-4.5" width="6" height="9" rx="1.5" fill="#e2e8f0" opacity="0.85"/>
<animateMotion dur="12.0s" repeatCount="indefinite" begin="0s" rotate="auto" calcMode="linear" keyPoints="0.3445;0.3445;1.0000;0.0000;0.3445;0.3445" keyTimes="0.0000;0.1333;0.4333;0.4350;0.8667;1.0000" path="M430,600 L430,345 L410,295 L410,0"/></g><g><rect x="-12" y="-6" width="24" height="12" rx="3" fill="#fb923c"/><rect x="3" y="-4.5" width="6" height="9" rx="1.5" fill="#e2e8f0" opacity="0.85"/>
<animateMotion dur="12.0s" repeatCount="indefinite" begin="-6s" rotate="auto" calcMode="linear" keyPoints="0.4288;0.4288;1.0000;0.0000;0.4288;0.4288" keyTimes="0.0000;0.0333;0.3333;0.3350;0.7500;1.0000" path="M0,320 L800,320"/></g><g><rect x="-12" y="-6" width="24" height="12" rx="3" fill="#fb923c"/><rect x="3" y="-4.5" width="6" height="9" rx="1.5" fill="#e2e8f0" opacity="0.85"/>
<animateMotion dur="12.0s" repeatCount="indefinite" begin="-6s" rotate="auto" calcMode="linear" keyPoints="0.3912;0.3912;1.0000;0.0000;0.3912;0.3912" keyTimes="0.0000;0.1083;0.4083;0.4100;0.8667;1.0000" path="M0,320 L800,320"/></g><g><rect x="-12" y="-6" width="24" height="12" rx="3" fill="#f472b6"/><rect x="3" y="-4.5" width="6" height="9" rx="1.5" fill="#e2e8f0" opacity="0.85"/>
<animateMotion dur="12.0s" repeatCount="indefinite" begin="-6s" rotate="auto" calcMode="linear" keyPoints="0.4288;0.4288;1.0000;0.0000;0.4288;0.4288" keyTimes="0.0000;0.0583;0.3583;0.3600;0.7500;1.0000" path="M800,280 L0,280"/></g><g><rect x="-12" y="-6" width="24" height="12" rx="3" fill="#f472b6"/><rect x="3" y="-4.5" width="6" height="9" rx="1.5" fill="#e2e8f0" opacity="0.85"/>
<animateMotion dur="12.0s" repeatCount="indefinite" begin="-6s" rotate="auto" calcMode="linear" keyPoints="0.3912;0.3912;1.0000;0.0000;0.3912;0.3912" keyTimes="0.0000;0.1333;0.4333;0.4350;0.8667;1.0000" path="M800,280 L0,280"/></g>
<text x="20" y="580" fill="#64748b" font-size="12">Schematic only. Not simulation output. Northbound NS flow shown; geometry and timing are illustrative.</text>
</g>
<!-- right panel -->
<rect x="830" y="60" width="250" height="560" rx="12" fill="#1e293b" stroke="#334155"/>
<text x="850" y="92" fill="#f8fafc" font-size="16" font-weight="bold">Controller view</text>
<text x="850" y="125" fill="#94a3b8" font-size="13">Active phase</text>
<text x="850" y="150" fill="#22c55e" font-size="18" font-weight="bold">NS green
<animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" values="1;0;0" keyTimes="0;0.4167;1"/></text>
<text x="850" y="150" fill="#facc15" font-size="18" font-weight="bold" opacity="0">NS yellow
<animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.4167;0.5;1"/></text>
<text x="850" y="150" fill="#fb923c" font-size="18" font-weight="bold" opacity="0">EW green
<animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.5;0.9167;1"/></text>
<text x="850" y="150" fill="#facc15" font-size="18" font-weight="bold" opacity="0">EW yellow
<animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" values="0;1;0" keyTimes="0;0.9167;1"/></text>
<text x="850" y="200" fill="#94a3b8" font-size="13">Downstream occupancy</text>
<rect x="870" y="220" width="40" height="300" rx="4" fill="#0f172a" stroke="#475569"/>
<rect x="870" y="460" width="40" height="60" rx="4" fill="#38bdf8">
<animate attributeName="height" dur="12.0s" repeatCount="indefinite" values="60;120;255;255;90;60" keyTimes="0;0.3333;0.5833;0.75;0.9167;1"/>
<animate attributeName="y" dur="12.0s" repeatCount="indefinite" values="460;400;265;265;430;460" keyTimes="0;0.3333;0.5833;0.75;0.9167;1"/>
</rect>
<line x1="860" y1="295" x2="920" y2="295" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4"/>
<text x="926" y="299" fill="#fca5a5" font-size="12">OCC_OVERRIDE = 0.75</text><text x="930" y="224" fill="#94a3b8" font-size="11">1.0</text><text x="930" y="524" fill="#94a3b8" font-size="11">0</text>
<text x="850" y="560" fill="#ef4444" font-size="15" font-weight="bold" opacity="0">OVERRIDE: hold NS
<animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.5278;0.78;1"/></text>
<text x="850" y="582" fill="#94a3b8" font-size="12" opacity="0">Spillback guard engaged
<animate attributeName="opacity" calcMode="discrete" dur="12.0s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.5278;0.78;1"/></text>
<text x="850" y="605" fill="#64748b" font-size="11">Illustrative loop, not measured data</text>
</svg>