name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sanity-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run structural sanity tests
        run: pytest tests/ -v
